name: Build and Release PotensioCE

on:
  push:
    tags:
      - "v*"   # Tags triggered on version releases, e.g., v1.0.0

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # Allow writing to repository
      actions: read    # Allow reading actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: main  # or 'master' depending on your default branch

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build with CMake
        run: cmake --build build --config Release

      - name: Build installer with Inno Setup
        run: ISCC.exe installer.iss

      - name: Rename installer
        run: |
          mkdir artifacts
          mv Output\PotensioCE-Installer.exe artifacts\PotensioCE-${{ github.ref_name }}.exe

      - name: Update appcast.xml
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $url = "https://alviansm.github.io/Potensio-CE/PotensioCE-$version.exe"
          $date = Get-Date -Format "ddd, dd MMM yyyy HH:mm:ss 'GMT'"
          $xml = @"
          <?xml version='1.0' encoding='utf-8'?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>PotensioCE Updates</title>
              <link>https://alviansm.github.io/Potensio-CE/</link>
              <description>Appcast for PotensioCE</description>
              <language>en</language>
              <item>
                <title>Version $version</title>
                <sparkle:releaseNotesLink>https://github.com/alviansm/Potensio-CE/releases/tag/v$version</sparkle:releaseNotesLink>
                <pubDate>$date</pubDate>
                <enclosure url="$url" sparkle:version="$version" type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          "@
          $xml | Out-File -Encoding utf8 docs/appcast.xml

      - name: Commit and push appcast.xml
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/appcast.xml
          git commit -m "Update appcast.xml for ${{ github.ref_name }}" || exit 0
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}